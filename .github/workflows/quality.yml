name: Code Quality Checks

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - '.github/workflows/quality.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'src/**'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements/dev.txt

      - name: Run flake8
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run pylint
        run: pylint src/ --disable=duplicate-code,too-many-arguments --exit-zero
        continue-on-error: true

      - name: Check formatting with black
        run: black --check src/ tests/ || true
        continue-on-error: true

      - name: Check import sorting with isort
        run: isort --check-only src/ tests/ || true
        continue-on-error: true

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports --pretty
        continue-on-error: true

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r src/ -ll -v || true
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
