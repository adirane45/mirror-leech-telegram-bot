[mypy]
# For standalone mypy runs (can also use pyproject.toml)
# This file is optional - pyproject.toml is primary config

python_version = 3.11
ignore_missing_imports = False
warn_unused_configs = True
pretty = True
show_error_codes = True

# Strict per-file overrides
[mypy-config.*]
strict = True

