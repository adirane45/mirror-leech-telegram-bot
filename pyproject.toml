[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-leech-telegram-bot"
version = "3.2.1"
description = "Production-grade Telegram bot for mirroring and leeching files"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "Adi", email = "adihere_bot@example.com"}
]
requires-python = ">=3.11"

[tool.black]
line-length = 120
target-version = ['py311', 'py312', 'py313']

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
# Type checking configuration - gradually improving type safety
python_version = "3.11"

# Core strict settings
strict = false  # Not fully strict yet, but using selective strict settings
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Allow gradual typing
disallow_untyped_defs = false  # Too aggressive for now, use per-file strategy
disallow_incomplete_defs = false
disallow_untyped_calls = false
no_implicit_optional = true
no_implicit_reexport = true

# Performance & reporting
warn_return_any = false  # Reduce noise initially
warn_unreachable = true
pretty = true
show_error_codes = true
show_error_context = true

# External library handling
ignore_missing_imports = false
[[tool.mypy.overrides]]
module = [
    "telegram",
    "telegram.*",
    "aria2p",
    "qbittorrent",
    "telegram_bot_pagination",
    "dotenv",
    "kombu",
    "celery",
    "celery.*",
    "aiofiles",
    "anytree",
    "pydrive2",
    "apscheduler",
    "apscheduler.*",
    "passlib",
    "passlib.*",
]
ignore_missing_imports = true

# Integration modules: relax strict checks for third-party wrappers
[[tool.mypy.overrides]]
module = [
    "integrations.rclone.*",
    "integrations.myjd.*",
    "integrations.sabnzbdapi.*",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false

# Progressive: Files to enforce strict typing
# Start with green modules only, expand gradually
[[tool.mypy.overrides]]
module = [
    "config",
    "config.main_config",
