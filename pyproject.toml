[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-leech-telegram-bot"
version = "3.2.1"
description = "Production-grade Telegram bot for mirroring and leeching files"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "Adi", email = "adihere_bot@example.com"}
]
requires-python = ">=3.11"

[tool.black]
line-length = 120
target-version = ['py311', 'py312', 'py313']

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
