---
# Kubernetes Secrets Configuration
#
# This file defines all secrets used by the MLTB application.
#
# IMPORTANT: Never commit this file with actual secret values to git.
# Use sealed-secrets or external-secrets operator in production.
#
# To create secrets:
#   kubectl create secret generic mltb-secrets \
#     --from-literal=BOT_TOKEN="$BOT_TOKEN" \
#     --from-literal=TELEGRAM_API="$TELEGRAM_API" \
#     # ... etc
#
# Or use kustomize with secrets generator:
#   kustomization.yaml:
#     secretGenerator:
#     - name: mltb-secrets
#       envs:
#       - secrets.env

apiVersion: v1
kind: Secret
metadata:
  name: mltb-telegram-secrets
  namespace: mltb
  labels:
    app: mltb-app
    component: secrets
  annotations:
    description: "Telegram Bot Configuration"
    rotation-schedule: "monthly"
    backup: "yes"
type: Opaque
stringData:
  BOT_TOKEN: "REPLACE_WITH_ACTUAL_TOKEN"
  TELEGRAM_API: "REPLACE_WITH_ACTUAL_API_ID"
  TELEGRAM_HASH: "REPLACE_WITH_ACTUAL_API_HASH"
  OWNER_ID: "REPLACE_WITH_OWNER_ID"
  AUTHORIZED_CHATS: "REPLACE_WITH_AUTHORIZED_CHATS"
  USER_SESSION_STRING: "REPLACE_WITH_SESSION_STRING"

---
apiVersion: v1
kind: Secret
metadata:
  name: mltb-database-secrets
  namespace: mltb
  labels:
    app: mltb-app
    component: secrets
  annotations:
    description: "Database Configuration"
    rotation-schedule: "quarterly"
    backup: "yes"
type: Opaque
stringData:
  DATABASE_URL: "mongodb://username:password@mongodb:27017/mltb"
  DATABASE_USERNAME: "mltb_user"
  DATABASE_PASSWORD: "REPLACE_WITH_SECURE_PASSWORD"

---
apiVersion: v1
kind: Secret
metadata:
  name: mltb-redis-secrets
  namespace: mltb
  labels:
    app: mltb-app
    component: secrets
  annotations:
    description: "Redis Configuration"
    rotation-schedule: "quarterly"
    backup: "yes"
type: Opaque
stringData:
  REDIS_URL: "redis://:REPLACE_WITH_PASSWORD@redis:6379/0"
  REDIS_PASSWORD: "REPLACE_WITH_SECURE_PASSWORD"

---
apiVersion: v1
kind: Secret
metadata:
  name: mltb-rclone-secrets
  namespace: mltb
  labels:
    app: mltb-app
    component: secrets
  annotations:
    description: "Rclone Configuration (Cloud Storage)"
    rotation-schedule: "semi-annually"
    backup: "yes"
type: Opaque
stringData:
  RCLONE_CONFIG_PATH: "/etc/rclone/rclone.conf"
  # Note: rclone.conf should be provided as a ConfigMap or Secret file
  # to avoid inline secrets

---
apiVersion: v1
kind: Secret
metadata:
  name: mltb-ssl-secrets
  namespace: mltb
  labels:
    app: mltb-app
    component: secrets
  annotations:
    description: "SSL/TLS Certificates"
    rotation-schedule: "yearly"
    backup: "yes"
type: tls
# Use kubectl create secret tls mltb-ssl-secrets --cert=path/to/cert --key=path/to/key
# Or base64 encode:
# stringData:
#   tls.crt: |
#     -----BEGIN CERTIFICATE-----
#     MIID9TCCA...
#     -----END CERTIFICATE-----
#   tls.key: |
#     -----BEGIN PRIVATE KEY-----
#     MIIEvQIB...
#     -----END PRIVATE KEY-----

---
apiVersion: v1
kind: Secret
metadata:
  name: mltb-api-secrets
  namespace: mltb
  labels:
    app: mltb-app
    component: secrets
  annotations:
    description: "API Keys and Tokens"
    rotation-schedule: "semi-annually"
    backup: "yes"
type: Opaque
stringData:
  API_SECRET_KEY: "REPLACE_WITH_SECRET_KEY"
  # Additional API keys here
  # GRAFANA_API_KEY: "..."
  # PROMETHEUS_BEARER_TOKEN: "..."

---
# OPTIONAL: ServiceAccount for secret access
# Use RBAC to restrict which pods can read which secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mltb-secret-reader
  namespace: mltb
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
  resourceNames:
  - mltb-telegram-secrets
  - mltb-database-secrets
  - mltb-redis-secrets
  - mltb-rclone-secrets
  - mltb-api-secrets

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mltb-secret-reader-binding
  namespace: mltb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mltb-secret-reader
subjects:
- kind: ServiceAccount
  name: mltb-app
  namespace: mltb

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mltb-app
  namespace: mltb
