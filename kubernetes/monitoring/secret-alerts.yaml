# Prometheus Alert Rules and Metrics for Secret Management
# 
# Deploy with:
#   kubectl apply -f kubernetes/monitoring/secret-alerts.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: mltb-secret-alerts
  namespace: mltb
  labels:
    app: mltb-app
    component: monitoring
data:
  secret-alerts.yaml: |
    groups:
    - name: mltb-secrets
      interval: 30s
      rules:

      # Alert: Secret not rotated for 30+ days (warning)
      - alert: SecretNotRotated30Days
        expr: |
          (time() - secret_last_rotated_timestamp{namespace="mltb"}) > (30 * 24 * 3600)
        for: 30m
        labels:
          severity: warning
          component: secrets
        annotations:
          summary: "Secret {{ $labels.secret_name }} not rotated in 30 days"
          description: |
            Secret '{{ $labels.secret_name }}' in namespace '{{ $labels.namespace }}'
            has not been rotated in over 30 days.
            Last rotation: {{ humanize (time() - $value) }} ago
            
            Action: Review rotation schedule or perform manual rotation
            Command: ./kubernetes/rotate-secret.sh {{ $labels.secret_name }} <key> <value>
          runbook_url: "https://example.com/docs/runbooks/secret-rotation.md"

      # Alert: Secret not rotated for 60+ days (critical)
      - alert: SecretNotRotated60Days
        expr: |
          (time() - secret_last_rotated_timestamp{namespace="mltb"}) > (60 * 24 * 3600)
        for: 10m
        labels:
          severity: critical
          component: secrets
        annotations:
          summary: "CRITICAL: Secret {{ $labels.secret_name }} not rotated in 60 days!"
          description: |
            Secret '{{ $labels.secret_name }}' is critically overdue for rotation
            ({{ humanize (time() - $value) }} since last rotation).
            
            This represents a significant security risk.
            Immediate action required: Rotate secret immediately
          runbook_url: "https://example.com/docs/runbooks/emergency-secret-rotation.md"

      # Alert: Secret rotation job failed
      - alert: SecretRotationJobFailed
        expr: |
          increase(secret_rotation_failed_total{namespace="mltb"}[1h]) > 0
        for: 5m
        labels:
          severity: high
          component: secrets
        annotations:
          summary: "Secret rotation job failed for {{ $labels.secret_name }}"
          description: |
            Secret rotation job for '{{ $labels.secret_name }}' failed in the last hour.
            
            Check logs:
              kubectl logs -n mltb -l job-name=mltb-secret-rotation-{{ $labels.secret_type }}-*
            
            Recent error count: {{ $value }}
          runbook_url: "https://example.com/docs/runbooks/debug-secret-rotation.md"

      # Alert: Secret access anomaly
      - alert: UnusualSecretAccessPattern
        expr: |
          rate(secret_read_total{namespace="mltb"}[5m]) > 
          (avg_over_time(rate(secret_read_total{namespace="mltb"}[1h])[24h:1h]) * 5)
        for: 2m
        labels:
          severity: warning
          component: secrets-security
        annotations:
          summary: "Unusual secret access pattern detected"
          description: |
            Unusual number of secret reads detected from pod {{ $labels.pod }}:
            Current rate: {{ $value | humanize }}/sec
            
            This could indicate:
            - Legitimate increased load
            - Brute force attack
            - Misconfigured retry logic
            
            Review pod logs and access patterns immediately
          runbook_url: "https://example.com/docs/runbooks/investigate-secret-access.md"

      # Alert: Secret storage capacity warning
      - alert: SecretStorageCapacity
        expr: |
          secret_storage_bytes_used / secret_storage_bytes_limit > 0.8
        for: 15m
        labels:
          severity: warning
          component: secrets
        annotations:
          summary: "Secret storage capacity at {{ $value | humanizePercentage }}"
          description: |
            Kubernetes secret storage is at {{ $value | humanizePercentage }} capacity.
            Used: {{ $value | humanize }} bytes
            
            Consider archiving old secrets or increasing etcd storage
          runbook_url: "https://example.com/docs/runbooks/manage-secret-storage.md"

      # Alert: Secret decryption failures (sealed-secrets)
      - alert: SealedSecretDecryptionFailure
        expr: |
          increase(sealed_secrets_decryption_failures_total{namespace="mltb"}[1h]) > 0
        for: 5m
        labels:
          severity: critical
          component: secrets-encryption
        annotations:
          summary: "Sealed secret decryption failure in {{ $labels.namespace }}"
          description: |
            Sealed secrets controller is unable to decrypt secrets.
            This could indicate:
            - Sealing key corruption or loss
            - Wrong decryption key in use
            - Secret tampering
            
            Immediate investigation required.
            Check sealed-secrets controller logs:
              kubectl logs -n kube-system -l app=sealed-secrets -f
          runbook_url: "https://example.com/docs/runbooks/sealed-secrets-recovery.md"

      # Alert: RBAC permission denied on secrets
      - alert: SecretAccessDenied
        expr: |
          increase(secret_rbac_denied_total{namespace="mltb"}[1h]) > 5
        for: 10m
        labels:
          severity: warning
          component: secrets-security
        annotations:
          summary: "Multiple secret access denials from {{ $labels.pod }}"
          description: |
            Pod {{ $labels.pod }} attempted unauthorized secret access {{ $value }} times.
            
            Check RBAC configuration:
              kubectl get rolebinding -n mltb
              kubectl get clusterrolebinding | grep secret
            
            Pod may need additional permissions or is misconfigured.
          runbook_url: "https://example.com/docs/runbooks/debug-secret-rbac.md"

      # Recording Rules: Calculate secret age
      - record: secret:age_days
        expr: |
          (time() - secret_last_rotated_timestamp) / 86400

      - record: secret:age_weeks
        expr: |
          (time() - secret_last_rotated_timestamp) / (86400 * 7)

      # Recording Rules: Rotation success rate
      - record: secret_rotation:success_rate
        expr: |
          rate(secret_rotation_success_total[1h]) /
          (rate(secret_rotation_success_total[1h]) + rate(secret_rotation_failed_total[1h]))

      # Recording Rules: Average rotation time
      - record: secret_rotation:avg_time_seconds
        expr: |
          rate(secret_rotation_duration_seconds_sum[1h]) /
          rate(secret_rotation_duration_seconds_count[1h])

---
# ServiceMonitor for Prometheus to scrape secret metrics (requires Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mltb-secret-metrics
  namespace: mltb
  labels:
    app: mltb-app
    component: monitoring
spec:
  selector:
    matchLabels:
      app: mltb-app
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    scheme: http
    # Only scrape metrics related to secrets
    metricRelabelings:
    - source_labels: [__name__]
      regex: 'secret.*|sealed_secret.*'
      action: keep

---
# PrometheusRule for alert evaluation (requires Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mltb-secret-alerts
  namespace: mltb
  labels:
    app: mltb-app
    component: monitoring
spec:
  groups:
  - name: mltb.secrets
    interval: 30s
    rules:

    # Metric: Track secret age
    - record: mltb:secret:age_in_days
      expr: |
        (time() - secret_last_rotated_timestamp{namespace="mltb"}) / 86400

    # Alert: Critical - Token not rotated in 90+ days
    - alert: CriticalSecretOverdue
      expr: |
        mltb:secret:age_in_days{secret_type=~"bot_token|api_key|database_password"} > 90
      for: 5m
      labels:
        severity: critical
        component: secrets
      annotations:
        summary: "CRITICAL: {{ $labels.secret_name }} overdue for rotation ({{ $value | humanize }} days)"
        description: |
          Secret {{ $labels.secret_name }} has not been rotated in {{ $value | humanize }} days.
          This exceeds the maximum recommended age of 90 days.
          
          Immediate action required:
          1. Review rotation policy
          2. Perform manual rotation if automatic failed
          3. Investigate cause of rotation failure

    # Alert: Warning - Token not rotated in 60+ days
    - alert: WarningSecretExpiring
      expr: |
        mltb:secret:age_in_days{secret_type=~"bot_token|api_key|database_password"} > 60
      for: 30m
      labels:
        severity: warning
        component: secrets
      annotations:
        summary: "{{ $labels.secret_name }} approaching rotation deadline ({{ $value | humanize }} days)"
        description: |
          Secret {{ $labels.secret_name }} was last rotated {{ $value | humanize }} days ago.
          Automatic rotation should occur within next 30 days.

    # Alert: Rotation job did not complete
    - alert: RotationJobStalled
      expr: |
        (time() - job_completion_timestamp{job="mltb-secret-rotation"}) > 86400
      for: 1h
      labels:
        severity: high
        component: secrets
      annotations:
        summary: "Secret rotation job {{ $labels.rotation_type }} has not completed in 24+ hours"
        description: |
          The {{ $labels.rotation_type }} secret rotation job did not complete successfully.
          
          Check job status: kubectl get cronjob -n mltb
          Review logs: kubectl describe cronjob mltb-secret-rotation-{{ $labels.rotation_type }}

---
# Sample Grafana Dashboard ConfigMap
# Import this into Grafana for secret management visualization
apiVersion: v1
kind: ConfigMap
metadata:
  name: mltb-secret-dashboard
  namespace: mltb
  labels:
    app: mltb-app
    grafana_dashboard: "1"
data:
  mltb-secrets.json: |
    {
      "dashboard": {
        "title": "MLTB Secret Management",
        "description": "Monitor secret rotation, age, and system health",
        "uid": "mltb-secrets",
        "timezone": "utc",
        "panels": [
          {
            "title": "Secret Age (Days)",
            "targets": [
              {
                "expr": "mltb:secret:age_in_days"
              }
            ],
            "type": "stat",
            "threshold": [30, 60, 90]
          },
          {
            "title": "Rotation Success Rate",
            "targets": [
              {
                "expr": "secret_rotation:success_rate"
              }
            ],
            "type": "gauge"
          },
          {
            "title": "Recent Rotation Events",
            "targets": [
              {
                "expr": "rate(secret_rotation_success_total[1h])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Failed Rotations",
            "targets": [
              {
                "expr": "rate(secret_rotation_failed_total[1h])"
              }
            ],
            "type": "graph",
            "alert": true
          }
        ]
      }
    }
