---
# Kubernetes CronJob for Daily Rclone Token Refresh
# Rotates Rclone cloud storage token daily at 2 AM UTC
# Ensures all cluster nodes have latest token without service interruption

apiVersion: batch/v1
kind: CronJob
metadata:
  name: mltb-secret-rotation-rclone-daily
  namespace: mltb
  labels:
    app: mltb-app
    component: secret-rotation
    schedule: daily
spec:
  # Schedule: Daily at 2 AM UTC
  schedule: "0 2 * * *"
  
  # Keep last 3 job runs for debugging
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  
  # Prevent multiple concurrent runs
  concurrencyPolicy: Forbid
  
  # Deadline: Complete within 10 minutes or abort
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      completionMode: NonIndexed
      
      template:
        metadata:
          labels:
            app: mltb-app
            component: secret-rotation
            type: rclone-daily
          annotations:
            description: "Daily Rclone token refresh rotation"
        spec:
          serviceAccountName: mltb-secret-rotator
          restartPolicy: OnFailure
          
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          
          containers:
          - name: secret-rotator
            image: mirror-leech-telegram-bot:latest
            imagePullPolicy: Always
            
            command:
            - /bin/bash
            - -c
            - |
              set -e
              
              echo "Starting daily Rclone token refresh..."
              
              # 1. Get new token from auth service
              echo "Fetching new Rclone token from auth service..."
              NEW_RCLONE_TOKEN=$(curl -s "https://rclone-auth.service/refresh" \
                --header "Authorization: Bearer ${RCLONE_AUTH_TOKEN}" \
                --header "Content-Type: application/json" \
                --connect-timeout 10 \
                --max-time 30 | jq -r '.token')
              
              if [ -z "$NEW_RCLONE_TOKEN" ]; then
                echo "ERROR: Failed to fetch new Rclone token"
                exit 1
              fi
              
              echo "✓ Fetched new Rclone token"
              
              # 2. Rotate secret in Kubernetes
              echo "Rotating secret in Kubernetes..."
              /app/kubernetes/rotate-secret.sh \
                mltb-rclone-secrets \
                RCLONE_CONFIG_PATH \
                "$NEW_RCLONE_TOKEN" \
                --strategy rolling \
                --namespace mltb
              
              echo "✓ Secret rotation completed"
              
              # 3. Send success notification
              curl -X POST https://alerts.service/notify \
                -H "Content-Type: application/json" \
                -d '{
                  "status": "success",
                  "message": "Daily Rclone token refresh completed",
                  "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
                  "cluster": "production"
                }' || echo "Warning: Failed to send notification"
              
              echo "✓ Daily rotation job completed successfully"
            
            env:
            # Auth credentials for token refresh service
            - name: RCLONE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mltb-rotation-credentials
                  key: rclone-refresh-token
            
            # Rotation script location
            - name: ROTATION_SCRIPT
              value: "/app/kubernetes/rotate-secret.sh"
            
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
            
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL

---
# Kubernetes CronJob for Quarterly Database Password Rotation
# Rotates database password every 90 days (first day of quarter at 3 AM)

apiVersion: batch/v1
kind: CronJob
metadata:
  name: mltb-secret-rotation-database-quarterly
  namespace: mltb
  labels:
    app: mltb-app
    component: secret-rotation
    schedule: quarterly
spec:
  # Schedule: 1st, 91st, 181st, 271st day of year at 3 AM UTC
  # Cron: 0 3 1,4,7,10 * * (approximation: 1st of Jan, Apr, Jul, Oct)
  schedule: "0 3 1 1,4,7,10 *"
  
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 10
  concurrencyPolicy: Forbid
  
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800  # 30 minutes for database rotation
      
      template:
        metadata:
          labels:
            app: mltb-app
            component: secret-rotation
            type: database-quarterly
          annotations:
            description: "Quarterly database password rotation"
            risk-level: "high"  # Database password change requires care
        spec:
          serviceAccountName: mltb-secret-rotator
          restartPolicy: OnFailure
          
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          
          containers:
          - name: secret-rotator
            image: mirror-leech-telegram-bot:latest
            imagePullPolicy: Always
            
            command:
            - /bin/bash
            - -c
            - |
              set -e
              
              echo "Starting quarterly database password rotation..."
              
              # 1. Generate new secure password
              echo "Generating new secure password..."
              NEW_DB_PASSWORD=$(openssl rand -base64 32)
              
              if [ -z "$NEW_DB_PASSWORD" ]; then
                echo "ERROR: Failed to generate new password"
                exit 1
              fi
              
              echo "✓ Generated new password"
              
              # 2. Update database with new password + grace period
              echo "Updating database to accept new password (grace period: 60s)..."
              
              # Connect to database and add new password
              python3 << 'EOF'
import os
import pymongo
import time
from datetime import datetime, timedelta

# Connect to database
db_url = os.environ.get("DATABASE_URL")
client = pymongo.MongoClient(db_url)
db = client.admin
              
# Create new user with new password (or update existing)
new_password = os.environ.get("NEW_DB_PASSWORD")
username = os.environ.get("DATABASE_USERNAME")

try:
    db.command('updateUser', username, pwd=new_password, mechanisms=['SCRAM-SHA-256'])
    print(f"✓ Database password updated for user '{username}'")
    
    # Grace period: Database accepts both old and new for 60 seconds
    print("⏳ 60-second grace period: Both old & new passwords work")
    time.sleep(60)
    print("✓ Grace period ended")
except Exception as e:
    print(f"ERROR: Failed to update database password: {e}")
    raise
finally:
    client.close()
EOF
              
              # 3. Rotate secret in Kubernetes (rolling strategy for safety)
              echo "Rotating secret in Kubernetes with blue-green strategy..."
              /app/kubernetes/rotate-secret.sh \
                mltb-database-secrets \
                DATABASE_PASSWORD \
                "$NEW_DB_PASSWORD" \
                --strategy blue-green \
                --namespace mltb
              
              echo "✓ Secret rotation completed"
              
              # 4. Verify connectivity with new password
              echo "Verifying database connectivity with new password..."
              
              python3 << 'EOF'
import os
import pymongo
import time

db_url = os.environ.get("DATABASE_URL")

for attempt in range(5):
    try:
        client = pymongo.MongoClient(db_url, serverSelectionTimeoutMS=5000)
        client.admin.command('ping')
        print("✓ Database connectivity verified with new password")
        client.close()
        break
    except Exception as e:
        if attempt < 4:
            print(f"Attempt {attempt+1}: Connection failed, retrying in 10s...")
            time.sleep(10)
        else:
            print(f"ERROR: Could not verify database connectivity: {e}")
            raise
EOF
              
              # 5. Disable old password (database-specific)
              echo "Disabling old password on database..."
              # This is optional - removes old password from database
              # Comment out if you want to keep it for rollback
              
              # 6. Update backup credentials if needed
              echo "Updating backup system with new credentials..."
              # kubectl create secret generic mltb-db-backup-credentials \
              #   --from-literal=PASSWORD="$NEW_DB_PASSWORD" \
              #   --dry-run=client -o yaml | kubectl apply -f -
              
              # 7. Send notification
              curl -X POST https://alerts.service/notify \
                -H "Content-Type: application/json" \
                -d '{
                  "status": "success",
                  "message": "Quarterly database password rotation completed",
                  "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
                  "severity": "info"
                }' || echo "Warning: Failed to send notification"
              
              echo "✓ Quarterly rotation job completed successfully"
            
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mltb-database-secrets
                  key: DATABASE_URL
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mltb-database-secrets
                  key: DATABASE_USERNAME
            - name: NEW_DB_PASSWORD
              value: "$(openssl rand -base64 32)"
            
            resources:
              requests:
                memory: "512Mi"
                cpu: "200m"
              limits:
                memory: "1Gi"
                cpu: "1000m"
            
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false  # Needs /tmp for scripts
              capabilities:
                drop:
                - ALL

---
# Kubernetes CronJob for Weekly Secret Rotation Health Check
# Validates that secret rotation infrastructure is working

apiVersion: batch/v1
kind: CronJob
metadata:
  name: mltb-secret-rotation-health-check
  namespace: mltb
  labels:
    app: mltb-app
    component: secret-rotation
    schedule: weekly
spec:
  # Schedule: Every Monday at 1 AM UTC
  schedule: "0 1 * * 1"
  
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 8
  concurrencyPolicy: Forbid
  
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      
      template:
        metadata:
          labels:
            app: mltb-app
            component: secret-rotation
            type: health-check
        spec:
          serviceAccountName: mltb-secret-rotator
          restartPolicy: OnFailure
          
          containers:
          - name: health-checker
            image: mirror-leech-telegram-bot:latest
            imagePullPolicy: Always
            
            command:
            - /bin/bash
            - -c
            - |
              set -e
              
              echo "Running secret rotation infrastructure health check..."
              
              HEALTH_STATUS="healthy"
              
              # Check 1: Validate rotation script exists
              if [ ! -f /app/kubernetes/rotate-secret.sh ]; then
                echo "❌ FAILED: Rotation script not found"
                HEALTH_STATUS="unhealthy"
              else
                echo "✓ Rotation script present"
              fi
              
              # Check 2: Verify all required secrets exist
              REQUIRED_SECRETS=("mltb-telegram-secrets" "mltb-database-secrets" "mltb-redis-secrets")
              for secret in "${REQUIRED_SECRETS[@]}"; do
                if kubectl get secret "$secret" -n mltb &>/dev/null; then
                  echo "✓ Secret '$secret' exists"
                else
                  echo "❌ FAILED: Secret '$secret' not found"
                  HEALTH_STATUS="unhealthy"
                fi
              done
              
              # Check 3: Verify deployment is running
              READY_REPLICAS=$(kubectl get deployment mltb-app -n mltb \
                -o jsonpath='{.status.readyReplicas}')
              DESIRED_REPLICAS=$(kubectl get deployment mltb-app -n mltb \
                -o jsonpath='{.spec.replicas}')
              
              if [ "$READY_REPLICAS" -eq "$DESIRED_REPLICAS" ]; then
                echo "✓ All replicas ready ($READY_REPLICAS/$DESIRED_REPLICAS)"
              else
                echo "⚠️  WARNING: Not all replicas ready ($READY_REPLICAS/$DESIRED_REPLICAS)"
                HEALTH_STATUS="degraded"
              fi
              
              # Check 4: Verify RBAC permissions
              if kubectl auth can-i patch secrets -n mltb &>/dev/null; then
                echo "✓ RBAC permissions verified"
              else
                echo "❌ FAILED: Insufficient RBAC permissions"
                HEALTH_STATUS="unhealthy"
              fi
              
              # Check 5: Verify logs for recent errors
              RECENT_ERRORS=$(kubectl logs -n mltb -l app=mltb-app \
                --since=24h --all-containers=true | \
                grep -c "ERROR.*secret" || true)
              
              if [ "$RECENT_ERRORS" -gt 5 ]; then
                echo "⚠️  WARNING: Multiple secret-related errors in logs"
                HEALTH_STATUS="degraded"
              else
                echo "✓ No excessive secret errors in logs"
              fi
              
              # Summary
              echo ""
              echo "========================="
              echo "Health Check Status: $HEALTH_STATUS"
              echo "========================="
              
              # Send metrics
              if [ "$HEALTH_STATUS" = "healthy" ]; then
                curl -X POST https://metrics.service/custom \
                  -d "secret_rotation_health=1" || true
                exit 0
              else
                curl -X POST https://metrics.service/custom \
                  -d "secret_rotation_health=0" || true
                exit 1
              fi
            
            resources:
              requests:
                memory: "128Mi"
                cpu: "50m"
              limits:
                memory: "256Mi"
                cpu: "200m"

---
# ServiceAccount for running secret rotation jobs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mltb-secret-rotator
  namespace: mltb
  labels:
    app: mltb-app
    component: secret-rotation

---
# ClusterRole for secret rotation operations
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mltb-secret-rotator
  labels:
    app: mltb-app
    component: secret-rotation
rules:
# Read/write secrets
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "patch", "update"]

# Control deployments (for rollouts)
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "patch", "update"]

# Monitor rollouts
- apiGroups: ["apps"]
  resources: ["deployments/rollout"]
  verbs: ["create", "get"]

# Read pods for health checks
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]

---
# ClusterRoleBinding for secret rotation
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mltb-secret-rotator-binding
  labels:
    app: mltb-app
    component: secret-rotation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mltb-secret-rotator
subjects:
- kind: ServiceAccount
  name: mltb-secret-rotator
  namespace: mltb

---
# Secret containing credentials for rotation operations
# This secret is used by CronJobs to authenticate with external services
# (e.g., token refresh endpoints, alert webhooks)
apiVersion: v1
kind: Secret
metadata:
  name: mltb-rotation-credentials
  namespace: mltb
  labels:
    app: mltb-app
    component: secret-rotation
type: Opaque
stringData:
  # Rclone auth service token (for token refresh)
  rclone-refresh-token: "replace-with-actual-token"
  
  # Alert service webhook token
  alert-webhook-token: "replace-with-actual-token"
  
  # Database admin credentials (for password rotation)
  database-admin-password: "replace-with-actual-password"

---
# PodMonitor for Prometheus (optional - requires Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mltb-secret-rotation
  namespace: mltb
  labels:
    app: mltb-app
    component: secret-rotation
spec:
  selector:
    matchLabels:
      component: secret-rotation
  podMetricsEndpoints:
  - port: metrics
    interval: 30s
    path: /metrics
