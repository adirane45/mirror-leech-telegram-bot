version: '3.8'

services:
  app-blue:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: mltb-app-blue
    restart: unless-stopped
    networks:
      - mltb-net
    env_file:
      - config/.env.production
    environment:
      - BASE_URL_PORT=8060
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ARIA2_HOST=aria2
      - ARIA2_PORT=6800
      - QB_HOST=qbittorrent
      - QB_PORT=8090
      - DATABASE_URL=
      - MONGODB_URI=
    volumes:
      - downloads:/app/downloads
      - logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      aria2:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8060/"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-green:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: mltb-app-green
    restart: unless-stopped
    networks:
      - mltb-net
    env_file:
      - config/.env.production
    environment:
      - BASE_URL_PORT=8060
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ARIA2_HOST=aria2
      - ARIA2_PORT=6800
      - QB_HOST=qbittorrent
      - QB_PORT=8090
      - DATABASE_URL=
      - MONGODB_URI=
    volumes:
      - downloads:/app/downloads
      - logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      aria2:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8060/"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: nginx:1.27-alpine
    container_name: mltb-web
    restart: unless-stopped
    networks:
      - mltb-net
    ports:
      - "8060:8060"
      - "9090:9090"
    environment:
      - ACTIVE_COLOR=blue
    volumes:
      - ./deployment/bluegreen/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      app-blue:
        condition: service_started
      app-green:
        condition: service_started
